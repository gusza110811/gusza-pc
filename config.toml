clock = "$CLOCK"
static = true # always set CWD to the directory of this config

[options]
ROM = "rom.bin"
CLOCK = "1M"

[[region]]
type = "rom"
source = "$ROM"
match = 0xC000
match_mask = 0xC000
address_mask = 0x3FFF

[[region]]
type = "ram"
size = 0x0100
match = 0x8000
match_mask = 0xF000
address_mask = 0x00FF
name = "page_table"

[[region]]
type = "acia"
match = 0x9000
match_mask = 0xF000
address_mask = 0x0003

[[region]]
type = "ram"
nv = true
file = "nvram0.img"
size = 0x1000
match = 0xA000
match_mask = 0xF000
address_mask = 0x1FFF

[[region]]
type = "ram"
size = 0x8000
match = 0x0000
match_mask = 0x8000
address_mask = 0x7FFF

banked = true
window_id_unused = 1 # 1 bit skipped
window_id_length = 8 # bits, including unused
bank_id_length = 2 # bytes
control_area = "page_table"
control_area_offset = 0
