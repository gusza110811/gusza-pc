clock = "$CLOCK"
static = true # always set CWD to the directory of this config

[options]
ROM = "rom.bin"
CLOCK = "1M"

[[region]]
type = "rom"
source = "$ROM"
match = 0xC000
match_mask = 0xC000
address_mask = 0x3FFF

[[region]]
type = "acia"
match = 0x9000
match_mask = 0xF000
address_mask = 0x0003

[[region]]
type = "ram"
nv = true
file = "nvram0.img"
size = 0x1000
match = 0xA000
match_mask = 0xF000
address_mask = 0x1FFF

[[region]]
type = "ram"
size = 0x0400
match = 0x0000
match_mask = 0xFC00
address_mask = 0x03FF
name = "static_mem"

[[region]]
type = "ram"
size = 0x7C00
match = 0x0000
match_mask = 0x8000
address_mask = 0x7FFF
offset = -1024

banked = true
window_id_length = 8 # bits
bank_id_length = 2 # bytes
control_area = "static_mem"
control_area_offset = 0x308
